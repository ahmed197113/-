name: Mawqi Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/determined-ride-fvej2t]
    paths:
      - 'mawqi/mobile/**'
      - '.github/workflows/mawqi-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mawqi/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mawqi/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # android/ is generated from app.json (Expo Continuous Native Generation).
      - run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mawqi/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="mawqi-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: mawqi/mobile/${{ steps.apk.outputs.name }}

      # A release gives a direct download link that opens on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mawqi-android-${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: المشاريع — نسخة أندرويد ${{ steps.apk.outputs.version }} (بناء ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: mawqi/mobile/${{ steps.apk.outputs.name }}
