name: Mawqi Android app (auto-updating)

# A small app that opens app.metal-lines.com/m — changes on the site reach phones with no new APK.
on:
  workflow_dispatch:
  push:
    branches: [claude/determined-ride-fvej2t]
    paths:
      - 'mawqi/android-shell/**'
      - '.github/workflows/mawqi-android-shell.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mawqi/android-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - name: Name the APK
        id: apk
        run: |
          NAME="mawqi-app-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$NAME" | head -5 || true
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mawqi-app-build${{ github.run_number }}
          name: المشاريع — تطبيق أندرويد يتحدث تلقائياً (بناء ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: mawqi/android-shell/${{ steps.apk.outputs.name }}
