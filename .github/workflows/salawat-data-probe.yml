name: Salawat data probe

on:
  push:
    paths:
      - "salawat-app/tools/probe.py"
      - ".github/workflows/salawat-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 salawat-app/tools/probe.py "$RUNNER_TEMP/out"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: salawat-data-probe-${{ github.run_number }}
          name: data probe ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            ${{ runner.temp }}/out/probe.txt

