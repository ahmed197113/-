name: Rafiq fill missing Mushaf fonts

on:
  push:
    paths:
      - ".github/workflows/rafiq-mushaf-fonts-fill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Upload every page font that is missing from the release
        run: |
          have=$(gh release view rafiq-mushaf-fonts-v2 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          mkdir -p f
          for n in $(seq 1 604); do
            echo "$have" | grep -qx "p$n.ttf" && continue
            for t in 1 2 3; do curl -sSfL -o f/p$n.ttf "https://static.qurancdn.com/fonts/quran/hafs/v2/ttf/p$n.ttf" && break; sleep 3; done
            for t in 1 2 3 4; do gh release upload rafiq-mushaf-fonts-v2 f/p$n.ttf --clobber -R "$GITHUB_REPOSITORY" && break; sleep $((t*5)); done
          done
          gh release view rafiq-mushaf-fonts-v2 -R "$GITHUB_REPOSITORY" --json assets -q '.assets | length'
