name: Salawat Android build

on:
  push:
    paths:
      - "salawat-app/**"
      - ".github/workflows/salawat-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salawat-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the bundled Quran text is the untouched Tanzil file
        run: echo "7f30c647331a61100ebf24a80507dc0fcdd9f2df97f1312b5b2dfcb982a7f326  app/src/main/assets/quran/tanzil-uthmani.txt" | sha256sum -c -

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set; release APK is signed with the runner's debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Rafiq-v6.3.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Rafiq-v6.3.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Rafiq-v6.3-apk
          path: ${{ runner.temp }}/Rafiq-v6.3.apk

      - name: Publish APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: salawat-v6.3-build${{ github.run_number }}
          name: رفيق المسلم v6.3 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            ${{ runner.temp }}/Rafiq-v6.3.apk
            ${{ runner.temp }}/Rafiq-v6.3.aab
