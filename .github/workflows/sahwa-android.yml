name: Build Sahwa APK

on:
  push:
    paths:
      - "sahwa-android/**"
      - ".github/workflows/sahwa-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sahwa-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Sahwa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sahwa-apk
          path: sahwa-android/Sahwa.apk

      # Fixed direct-download link:
      # https://github.com/<owner>/<repo>/releases/download/sahwa-latest/Sahwa.apk
      - name: Publish direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sahwa-latest
          target_commitish: ${{ github.sha }}
          name: صحوة — أحدث نسخة
          body: |
            حمّل **Sahwa.apk** وثبّته مباشرة على هاتفك الأندرويد (8.0 أو أحدث).
            بعد التثبيت: افتح التطبيق واتبع خطوات الإعداد، ثم فعّل «درع صحوة».
          files: sahwa-android/Sahwa.apk
          make_latest: true
