name: Barr — Android APK

on:
  push:
    branches: [claude/barr-elderly-care-app-zxgxox, main]
    paths: ['barr/**', '.github/workflows/barr-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barr-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: barr

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional: add a repository secret BARR_ENV_DEV containing env/dev.json
      # (see env/example.json) to build against Firebase. Without it the APK
      # runs in demo mode with data stored on the device.
      - name: Firebase config (optional)
        env:
          BARR_ENV_DEV: ${{ secrets.BARR_ENV_DEV }}
        run: |
          if [ -n "$BARR_ENV_DEV" ]; then
            echo "$BARR_ENV_DEV" > env/dev.json
            echo "DEFINES=--dart-define-from-file=env/dev.json" >> "$GITHUB_ENV"
          fi

      - name: Build APK (dev flavor)
        run: |
          flutter build apk --release --flavor dev -t lib/main_dev.dart $DEFINES
          cp build/app/outputs/flutter-apk/app-dev-release.apk barr-dev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: barr-dev-apk
          path: barr/barr-dev.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: barr-dev-latest
          name: برّ — نسخة تجريبية (dev)
          prerelease: true
          make_latest: false
          files: barr/barr-dev.apk
          body: |
            آخر نسخة تجريبية من تطبيق «برّ» للأندرويد.
            حمّل الملف barr-dev.apk من الأسفل وثبّته على الجوال (Android 8+).
            Commit: ${{ github.sha }}
