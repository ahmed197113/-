name: Build Time Trade APK

on:
  push:
    paths:
      - 'time-trade-game/**'
      - '.github/workflows/time-trade-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-trade-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TimeTrade.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTrade-apk
          path: time-trade-game/TimeTrade.apk
