name: Build Time Trade APK

on:
  push:
    paths:
      - 'time-trade-game/**'
      - '.github/workflows/time-trade-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-trade-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TimeTrade.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTrade-apk
          path: time-trade-game/TimeTrade.apk
      - name: Commit APK to branch
        working-directory: .
        run: |
          mkdir -p apk
          cp time-trade-game/TimeTrade.apk apk/TimeTrade.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/TimeTrade.apk
          git commit -m "Update built APK [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
