name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pregnancy-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pregnancy-app/android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the single-file web app
        working-directory: pregnancy-app
        run: python3 build.py

      - name: Create the Android project
        run: |
          npm install
          mkdir -p www
          cp ../dist/nabd.html www/index.html
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets || echo "icon generation skipped"
          npx cap sync android

      - name: Build the APK
        working-directory: pregnancy-app/android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nabd-apk
          path: pregnancy-app/android-app/android/app/build/outputs/apk/debug/app-debug.apk
