name: Build Android APK

on:
  push:
    paths:
      - 'custody-app/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: custody-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp custody-app/android/app/build/outputs/apk/release/app-release.apk CustodyApp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CustodyApp-apk
          path: CustodyApp.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: تطبيق إدارة العهد — نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ملف التثبيت على أندرويد. حمّل CustodyApp.apk وافتحه على الجوال (اسمح بالتثبيت من مصادر غير معروفة).
          files: CustodyApp.apk
