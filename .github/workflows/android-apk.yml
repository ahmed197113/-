name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pregnancy-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pregnancy-app/android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the single-file web app
        working-directory: pregnancy-app
        run: python3 build.py

      - name: Load the Play upload key
        env:
          KEY_B64: ${{ secrets.NABD_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/nabd-upload.jks"
            echo "NABD_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/nabd-upload.jks" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          fi

      # تسجيل الدخول بـ Google وFacebook عبر Firebase: يحتاج google-services.json
      # (ملف pregnancy-app/android-app/google-services.json في المستودع، أو Secret باسم NABD_GOOGLE_SERVICES_JSON)
      - name: Load the Firebase config
        env:
          GS: ${{ secrets.NABD_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > google-services.json; fi
          if [ -f google-services.json ]; then echo "HAS_FIREBASE=true" >> "$GITHUB_ENV"; else echo "HAS_FIREBASE=false" >> "$GITHUB_ENV"; echo "::warning::google-services.json not found — Google/Facebook login is disabled in this build"; fi

      - name: Create the Android project
        run: |
          npm install
          # بدون إعداد Firebase لا نضمّن الإضافة (وإلا يتوقف التطبيق عند الفتح)
          if [ "$HAS_FIREBASE" != "true" ]; then npm uninstall @capacitor-firebase/authentication @capacitor-firebase/crashlytics; fi
          mkdir -p www
          # نسخة التطبيق: الكود مدمج والصور ملفات منفصلة تُحمَّل عند الحاجة
          cp -r ../dist/www/. www/
          npx cap add android
          if [ -f google-services.json ]; then cp google-services.json android/app/; fi
          npx @capacitor/assets generate --android --assetPath assets || echo "icon generation skipped"
          cp -r res/. android/app/src/main/res/
          python3 patch-android.py
          npx cap sync android

      # Google Sign-In يحتاج Web client ID (client_type 3) وبصمة التوقيع مسجّلة في Firebase
      - name: Check the Google client IDs
        if: ${{ env.HAS_FIREBASE == 'true' }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          g = json.load(open('google-services.json'))
          WEB = '987831438755-a2c3ljr526b3hplfhr27mc3shnvlo22k.apps.googleusercontent.com'
          for c in g['client']:
              if c['client_info']['android_client_info']['package_name'] != 'app.nabd.pregnancy': continue
              for o in c.get('oauth_client', []):
                  print('oauth_client type', o['client_type'], o['client_id'][:24] + '…', ('cert ' + o['android_info']['certificate_hash']) if 'android_info' in o else '')
              webs = [o['client_id'] for o in c.get('oauth_client', []) if o['client_type'] == 3]
              hashes = [o['android_info']['certificate_hash'].lower() for o in c.get('oauth_client', []) if 'android_info' in o]
          print('serverClientId (client_type 3):', webs)
          if WEB not in webs: print('::warning::Web client ID in google-services.json differs from', WEB)
          if not webs: raise SystemExit('google-services.json has no Web client (client_type 3): enable Google sign-in in Firebase and download it again')
          if 'd5f7a1a13f4c1dca4c6236d81d84b9827b592f37' not in hashes: print('::warning::debug SHA-1 D5:F7…2F:37 is not in google-services.json — download it again after adding the fingerprint')
          PY

      - name: Build the APK
        working-directory: pregnancy-app/android-app/android
        run: ./gradlew assembleDebug --no-daemon

      # نسخة Google Play (AAB) — تُبنى فقط عند وجود مفتاح الرفع في GitHub Secrets
      - name: Build the Play Store bundle
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: pregnancy-app/android-app/android
        env:
          NABD_UPLOAD_PASSWORD: ${{ secrets.NABD_UPLOAD_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # نطبع بصمة التوقيع في السجل ونوقف النشر لو APK ليس موقّعاً بـ nabd-debug.keystore
      - name: Verify signing fingerprints
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-1 digest: d5f7a1a13f4c1dca4c6236d81d84b9827b592f37" certs.txt || { echo "::error::APK is not signed with nabd-debug.keystore (expected SHA-1 D5:F7…2F:37)"; exit 1; }
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA1|SHA256"; fi
          "$BT/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: nabd-apk
          path: pregnancy-app/android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a downloadable release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nabd.apk
          FILES=nabd.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab nabd.aab; FILES="nabd.apk nabd.aab"; fi
          gh release delete nabd-latest --yes --cleanup-tag || true
          gh release create nabd-latest $FILES --target "$GITHUB_SHA" --prerelease \
            --title "نبضٌ صغير — أحدث نسخة أندرويد" \
            --notes "ملف APK للتجربة. على الجوال: نزّلي الملف ثم افتحيه، واسمحي بالتثبيت من مصادر غير معروفة إذا طُلب. إن ظهر تحذير Play Protect اضغطي: التثبيت على أي حال."
        env:
          GH_TOKEN: ${{ github.token }}
