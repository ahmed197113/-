name: App CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK + AAB
        env:
          DEFINES: ${{ secrets.APP_DART_DEFINES }}
        run: |
          ARGS=""
          for d in $DEFINES; do ARGS="$ARGS --dart-define=$d"; done
          flutter build apk --release $ARGS
          flutter build appbundle --release $ARGS
          cp build/app/outputs/flutter-apk/app-release.apk ../munasaba.apk
          cp build/app/outputs/bundle/release/app-release.aab ../munasaba.aab

      - uses: actions/upload-artifact@v4
        with:
          name: munasaba-android
          path: |
            munasaba.apk
            munasaba.aab

      - name: Publish installable APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مناسبة — نسخة ${{ github.run_number }}
          prerelease: true
          body: |
            ملف APK جاهز للتثبيت على أندرويد (حمّل munasaba.apk من الهاتف وافتحه).
            Commit: ${{ github.sha }}
          files: |
            munasaba.apk
            munasaba.aab
