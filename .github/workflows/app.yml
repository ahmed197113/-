name: App CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK + AAB
        env:
          DEFINES: ${{ secrets.APP_DART_DEFINES }}
        run: |
          ARGS=""
          for d in $DEFINES; do ARGS="$ARGS --dart-define=$d"; done
          flutter build apk --release --split-per-abi $ARGS
          flutter build appbundle --release $ARGS
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../munasaba.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../munasaba-old-phones.apk
          cp build/app/outputs/bundle/release/app-release.aab ../munasaba.aab
          ls -la ../*.apk ../*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: munasaba-android
          path: |
            munasaba*.apk
            munasaba.aab

      - name: Publish installable APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: munasaba-build-${{ github.run_number }}
          name: مناسبة — نسخة ${{ github.run_number }}
          prerelease: true
          body: |
            ملف APK جاهز للتثبيت على أندرويد:
            - munasaba.apk — لمعظم الهواتف (64-bit)
            - munasaba-old-phones.apk — للهواتف القديمة (32-bit)
            Commit: ${{ github.sha }}
          files: |
            munasaba*.apk
            munasaba.aab

  device-flow:
    # Runs the full user flow on an Android emulator and attaches screenshots
    # to the release, so every build is verified on a real Android runtime.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_flow_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screenshots
          path: app/build/screenshots/
      - name: Attach screenshots to the release
        if: always() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: munasaba-build-${{ github.run_number }}
          files: app/build/screenshots/*.png
