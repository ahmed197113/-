name: Fetch a file (temporary transfer)

on:
  push:
    branches: [claude/determined-ride-fvej2t]
    paths: ['.github/fetch-url.txt']

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - run: curl -fsSL --retry 3 -o payload.bin "$(cat .github/fetch-url.txt)" && ls -la payload.bin
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload.bin
          retention-days: 1
