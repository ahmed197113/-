name: Fetch a file (temporary transfer)

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to download
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL --retry 3 -o payload.bin "${{ inputs.url }}" && ls -la payload.bin
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload.bin
          retention-days: 1
