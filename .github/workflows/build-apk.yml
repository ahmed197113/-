name: Build APK

on:
  push:
    branches: [ "ccr-c64259f4-oour2h", "main", "master" ]
    paths: [ "NetGuard/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetGuard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetGuard-debug-apk
          path: NetGuard/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release with APK (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: NetGuard APK v1.0.${{ github.run_number }}
          body: |
            تطبيق حارس الشبكة — نسخة تثبيت مباشرة.
            نزّل الملف app-debug.apk من الأسفل على هاتفك وثبّته
            (فعّل "تثبيت من مصادر غير معروفة" إذا طُلب منك).
          files: NetGuard/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
