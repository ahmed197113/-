name: Build APK

on:
  push:
    paths:
      - 'invoice-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk baqala-invoice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: baqala-invoice-apk
          path: invoice-app/baqala-invoice.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: فواتير البقالة ${{ github.run_number }}
          files: invoice-app/baqala-invoice.apk
