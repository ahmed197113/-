name: Build Mirra APK

on:
  push:
    paths:
      - 'mirra/**'
      - '.github/workflows/mirra-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Mirra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mirra-apk
          path: mirra/build/Mirra.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirra-build-${{ github.run_number }}
          name: Mirra build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: mirra/build/Mirra.apk
          body: |
            Mirra personality test — ready-to-install Android APK.
            Download **Mirra.apk** below, open it on your phone and allow "Install unknown apps".
