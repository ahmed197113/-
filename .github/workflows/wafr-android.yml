name: Wafr Android build

on:
  push:
    paths:
      - "wafr-app/**"
      - ".github/workflows/wafr-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wafr-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set; release APK is signed with the runner's debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Wafr-v2.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Wafr-v2.0-apk
          path: ${{ runner.temp }}/Wafr-v2.0.apk

      - name: Publish APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wafr-v2.0-build${{ github.run_number }}
          name: وَفْر v2.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            وَفْر — تطبيق إدارة الميزانية الشهرية.
            حمّل ملف Wafr-v2.0.apk من الأسفل وثبّته على هاتفك (اسمح بالتثبيت من مصادر غير معروفة).
          files: ${{ runner.temp }}/Wafr-v2.0.apk
