name: بناء تطبيق أندرويد

on:
  push:
    paths:
      - "ContractingAcademy/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "ContractingAcademy/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ContractingAcademy
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من المحتوى التعليمي وتطابقه مع ملفات JSON
        run: |
          python3 content-src/build.py
          git diff --exit-code -- app/src/main/assets/content

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: بناء ملفات APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ContractingAcademy-apk
          path: |
            ContractingAcademy/app/build/outputs/apk/release/*.apk
            ContractingAcademy/app/build/outputs/apk/debug/*.apk

      - name: نشر ملف APK في فرع apk للتنزيل المباشر
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/apk && cp ContractingAcademy/app/build/outputs/apk/release/app-release.apk /tmp/apk/ContractingAcademy.apk
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ContractingAcademy.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
