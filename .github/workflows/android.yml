name: Build Sahwa APK

on:
  push:
    branches: [claude/happy-volta-smvjpo]
    paths: [android-app/**, wake-app/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android-app assembleDebug --no-daemon
      - name: Name the APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk sahwa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahwa-apk
          path: sahwa.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sahwa-build-${{ github.run_number }}
          name: صحوة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "نزّل sahwa.apk على تليفونك وثبّته."
          files: sahwa.apk
