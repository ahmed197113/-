name: Rafiq prepare iqama and du'a audio

on:
  push:
    paths:
      - "salawat-app/tools/prepare_extra_audio.py"
      - ".github/workflows/rafiq-extra-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q faster-whisper numpy
      - run: python3 salawat-app/tools/prepare_extra_audio.py "$RUNNER_TEMP/x"
      - if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rafiq-extra-audio-${{ github.run_number }}
          name: Iqama and du'a audio ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ runner.temp }}/x/*
