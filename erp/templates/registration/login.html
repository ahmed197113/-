{% load static %}<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الدخول</title>
<link rel="stylesheet" href="{% static 'vendor/bootstrap.rtl.min.css' %}"><link rel="stylesheet" href="{% static 'vendor/bootstrap-icons.min.css' %}"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body><div class="login-wrap"><div class="card p-4" style="width:380px">
<div class="text-center mb-3"><i class="bi bi-buildings" style="font-size:3rem;color:#1f3a5f"></i><h4 class="fw-bold mt-2">نظام المحاسبة والمقاولات</h4><div class="text-muted small">سجّل الدخول للمتابعة</div></div>
<form method="post">{% csrf_token %}
{% if form.errors %}<div class="alert alert-danger py-2 small">اسم المستخدم أو كلمة المرور غير صحيحة</div>{% endif %}
<div class="mb-2"><label class="form-label small">اسم المستخدم</label><input name="username" class="form-control" autofocus required></div>
<div class="mb-3"><label class="form-label small">كلمة المرور</label><input type="password" name="password" class="form-control" required></div>
<button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-left"></i> دخول</button></form></div></div></body></html>
