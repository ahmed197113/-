{% for r in rows %}<tr class="{% if r.is_group %}grp{% endif %} {% if r.level == 0 %}lvl0{% endif %}"><td style="padding-right:calc({{ r.level }} * 1.2rem + .5rem)">{% if not r.is_group %}<a href="/reports/ledger/?account={{ r.account.id }}&date_from={{ date_from|date:'Y-m-d' }}&date_to={{ date_to|date:'Y-m-d' }}">{{ r.account.code }} {{ r.account.name }}</a>{% else %}{{ r.account.code }} {{ r.account.name }}{% endif %}</td><td class="num">{{ r.vals.0|money }}</td></tr>{% endfor %}
