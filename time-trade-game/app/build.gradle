plugins {
    id 'com.android.application'
}

android {
    namespace 'com.timetrade.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.timetrade.game'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // توقيع مؤقت بمفتاح التصحيح ليكون ملف APK قابلاً للتثبيت مباشرة
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
