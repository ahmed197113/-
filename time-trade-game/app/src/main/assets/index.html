<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>آلة الزمن التجارية</title>
<style>
:root{
  --bg:#14110d; --panel:#211c16; --panel2:#2b241c; --line:#3d3328;
  --text:#f3e9d8; --muted:#b5a68f; --gold:#e8b44a; --good:#5fc28a; --bad:#e2685a;
  --accent:#e8b44a; --accent-soft:rgba(232,180,74,.15);
}
body[data-era="baghdad"]{--accent:#3fb0a6;--accent-soft:rgba(63,176,166,.16)}
body[data-era="rome"]{--accent:#d0574a;--accent-soft:rgba(208,87,74,.16)}
body[data-era="egypt"]{--accent:#e8b44a;--accent-soft:rgba(232,180,74,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Tajawal","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:2px solid var(--accent);padding:12px 16px 10px}
.era-title{display:flex;align-items:center;gap:10px}
.era-icon{font-size:30px}
.era-name{font-size:19px;font-weight:700}
.era-year{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--muted)}
.stat.gold b{color:var(--gold)}

main{flex:1;padding:12px 16px 90px}
.section-h{font-size:14px;color:var(--muted);margin:14px 2px 8px}

/* event banner */
.event{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.event b{display:block;margin-bottom:2px}

/* market */
.good{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:right}
.good:active{transform:scale(.99)}
.good .ic{font-size:26px;text-align:center}
.good .nm{font-weight:700}
.good .own{font-size:12px;color:var(--muted)}
.price{text-align:center;min-width:54px}
.price small{display:block;font-size:10px;color:var(--muted)}
.price b{font-size:15px}
.price.buy b{color:var(--bad)}
.price.sell b{color:var(--good)}
.na{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-inline-start:4px}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted)}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--accent)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.dest{display:flex;gap:12px;align-items:center;width:100%;text-align:right}
.dest .ic{font-size:34px}
.dest .t{font-weight:700;font-size:17px}
.dest .d{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;background:var(--accent);color:#1a140c;font-weight:700;padding:12px;border-radius:12px;font-size:16px;text-align:center}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* knowledge */
.fact{background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-inline-start:3px solid var(--accent);font-size:14px}
.fact .h{font-weight:700;font-size:13px;margin-bottom:2px}
.fact.locked{opacity:.45;border-inline-start-color:var(--line)}
.progress{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.progress div{height:100%;background:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel2);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
.overlay.center{align-items:center;padding:16px}
.overlay.center .sheet{border-radius:18px}
.overlay.still .sheet{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.history{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.history b{color:var(--accent)}
.qty{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}
.qty button{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:20px}
.qty .n{font-size:26px;font-weight:700;min-width:60px;text-align:center}
.qty .mx{width:auto;border-radius:10px;padding:0 10px;font-size:13px}
.summary{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.opt{display:block;width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.opt.right{border-color:var(--good);background:rgba(95,194,138,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(226,104,90,.15)}

/* travel animation */
#warp{position:fixed;inset:0;z-index:30;background:radial-gradient(circle,#2a2140,#07060a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#warp .clock{font-size:80px;animation:spin 1s linear infinite}
#warp .y{font-size:28px;font-weight:700;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* start / end */
.splash{text-align:center;padding:30px 16px}
.splash .logo{font-size:70px}
.splash h1{margin:6px 0;font-size:28px;color:var(--gold)}
.splash p{color:var(--muted)}
.how{text-align:right;font-size:14px}
.how li{margin-bottom:6px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

];

/* ================= الإعدادات ================= */
const CFG = {startGold:150, startCap:15, jumps:25, fuel:12, spread:.06, impact:.035,
             upgrades:[{cap:10,cost:200},{cap:15,cost:500},{cap:20,cost:1100}]};
const SAVE_KEY = "timetrade_save_v1";

let S = null;          // حالة اللعبة
let tab = "market";
let sheet = null;      // نافذة مفتوحة

/* ================= التخزين ================= */
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ================= منطق اللعبة ================= */
function rnd(a,b){ return a + Math.random()*(b-a); }

function newGame(){
  const market = {};
  for(const er of ERA_ORDER){ market[er] = {}; for(const g of GOODS) market[er][g.id] = rnd(.85,1.15); }
  S = {gold:CFG.startGold, cap:CFG.startCap, upg:0, era:"egypt", jumpsLeft:CFG.jumps,
       cargo:{}, market, event:null, known:{}, quizOk:0, quizAll:0, bestTrade:0, over:false};
  arrive("egypt", true);
}

function arrive(era, first){
  S.era = era;
  // السوق يتعافى تدريجياً نحو التوازن أثناء غيابك + تقلب عشوائي
  for(const er of ERA_ORDER) for(const g of GOODS){
    let m = S.market[er][g.id];
    m = 1 + (m-1)*.5;
    if(er===era) m *= rnd(.88,1.12);
    S.market[er][g.id] = Math.min(2.2, Math.max(.4, m));
  }
  S.event = (!first && Math.random()<.5) ? Math.floor(Math.random()*EVENTS[era].length) : null;
  save();
}

function eventMult(gid){
  if(S.event===null) return 1;
  return EVENTS[S.era][S.event].m[gid] || 1;
}
function midPrice(gid, era=S.era){
  const base = G[gid].e[era].p;
  const ev = era===S.era ? eventMult(gid) : 1;
  return base * S.market[era][gid] * ev;
}
function buyPrice(gid){ return Math.max(1, Math.round(midPrice(gid)*(1+CFG.spread))); }
function sellPrice(gid){ return Math.max(1, Math.round(midPrice(gid)*(1-CFG.spread))); }
function canBuy(gid){ return !!G[gid].e[S.era].buy; }
function cargoUsed(){ return Object.values(S.cargo).reduce((a,c)=>a+c.qty,0); }
function owned(gid){ return S.cargo[gid] ? S.cargo[gid].qty : 0; }
function cargoValue(){ return Object.keys(S.cargo).reduce((a,gid)=>a+sellPrice(gid)*owned(gid),0); }

// تكلفة شراء/عائد بيع n وحدة مع أثر العرض والطلب (كل وحدة تحرك السعر)
function quote(gid, n, side){
  const saved = S.market[S.era][gid]; let total = 0;
  for(let i=0;i<n;i++){
    total += side==="buy" ? buyPrice(gid) : sellPrice(gid);
    S.market[S.era][gid] *= side==="buy" ? (1+CFG.impact) : (1-CFG.impact);
  }
  S.market[S.era][gid] = saved;
  return total;
}
function maxBuy(gid){
  let n=0; const room = S.cap-cargoUsed();
  while(n<room && quote(gid,n+1,"buy")<=S.gold) n++;
  return n;
}
function doTrade(gid, n, side){
  if(n<=0) return;
  const total = quote(gid,n,side);
  S.market[S.era][gid] *= Math.pow(side==="buy" ? 1+CFG.impact : 1-CFG.impact, n);
  S.market[S.era][gid] = Math.min(2.5, Math.max(.3, S.market[S.era][gid]));
  if(side==="buy"){
    S.gold -= total;
    const c = S.cargo[gid] || (S.cargo[gid]={qty:0,cost:0});
    c.qty += n; c.cost += total;
    toast(`اشتريت ${n} ${G[gid].name} بـ ${total} 🪙`);
  }else{
    const c = S.cargo[gid]; const avg = c.cost/c.qty;
    const profit = Math.round(total - avg*n);
    c.cost -= avg*n; c.qty -= n;
    if(c.qty<=0) delete S.cargo[gid];
    S.gold += total;
    if(profit>S.bestTrade) S.bestTrade = profit;
    toast(profit>=0 ? `ربح ${profit} 🪙 ✅` : `خسارة ${-profit} 🪙 ❌`);
  }
  save();
}

function travel(dest){
  if(S.jumpsLeft<=0) return;
  S.gold = Math.max(0, S.gold - CFG.fuel); S.jumpsLeft--;
  closeSheet();
  const w = document.getElementById("warp");
  w.querySelector(".y").textContent = ERAS[dest].year;
  w.querySelector(".n").textContent = ERAS[dest].name;
  w.classList.remove("hidden");
  setTimeout(()=>{
    w.classList.add("hidden");
    arrive(dest);
    tab = "market";
    render();
    if(S.jumpsLeft<=0) toast("هذه محطتك الأخيرة! بِع بضاعتك ثم أنهِ الرحلة");
    else if(Math.random()<.35) openQuiz();
  }, 1300);
}

function finalSale(){
  // آخر رحلة: تُباع البضائع المتبقية تلقائياً في السوق الحالي
  for(const gid of Object.keys(S.cargo)) doTrade(gid, owned(gid), "sell");
  S.over = true; save(); render();
}

function buyUpgrade(){
  const u = CFG.upgrades[S.upg]; if(!u) return;
  if(S.gold < u.cost){ toast("الذهب غير كافٍ"); return; }
  S.gold -= u.cost; S.cap += u.cap; S.upg++; save();
  toast(`🔧 سعة المخزن الآن ${S.cap}`); render();
}

function knowKey(gid,era){ return gid+"@"+era; }
function learn(gid,era){ if(!S.known[knowKey(gid,era)]){ S.known[knowKey(gid,era)]=1; save(); } }
function knownCount(){ return Object.keys(S.known).length; }
const TOTAL_FACTS = GOODS.length*ERA_ORDER.length;

/* ================= الواجهة ================= */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

function render(){
  const app = $("#app");
  if(!S){ app.innerHTML = startScreen(); document.body.dataset.era="egypt"; return; }
  if(S.over){ app.innerHTML = endScreen(); return; }
  document.body.dataset.era = S.era;
  const E = ERAS[S.era];
  app.innerHTML = `
  <header>
    <div class="era-title"><div class="era-icon">${E.icon}</div>
      <div><div class="era-name">${E.name}</div><div class="era-year">${E.year} · ${E.ruler}</div></div></div>
    <div class="stats">
      <div class="stat gold"><b>${S.gold}</b><span>🪙 ذهب</span></div>
      <div class="stat"><b>${cargoUsed()}/${S.cap}</b><span>📦 المخزن</span></div>
      <div class="stat"><b>${S.jumpsLeft}</b><span>⏳ رحلات متبقية</span></div>
    </div>
  </header>
  <main>${tab==="market"?marketView():tab==="machine"?machineView():bookView()}</main>
  <nav><div class="in">
    <button data-tab="market" class="${tab==="market"?"on":""}"><i>⚖️</i>السوق</button>
    <button data-tab="machine" class="${tab==="machine"?"on":""}"><i>⏳</i>آلة الزمن</button>
    <button data-tab="book" class="${tab==="book"?"on":""}"><i>📖</i>دفتر المعرفة</button>
  </div></nav>
  <div id="warp" class="hidden"><div class="clock">⏳</div><div class="y"></div><div class="n"></div></div>`;
  if(sheet) sheet();
}

function marketView(){
  let h = "";
  if(S.jumpsLeft<=0) h += `<div class="event"><b>⌛ محطتك الأخيرة</b>بِع ما تستطيع بأفضل سعر، ثم
    <button class="btn small" data-act="finish" style="margin-top:6px">أنهِ الرحلة</button></div>`;
  if(S.event!==null){ const ev = EVENTS[S.era][S.event]; h += `<div class="event"><b>${ev.t}</b>${ev.d}</div>`; }
  const mine = GOODS.filter(g=>owned(g.id)>0);
  const rest = GOODS.filter(g=>owned(g.id)===0);
  if(mine.length){ h += `<div class="section-h">بضاعتك (اضغط للبيع)</div>` + mine.map(goodRow).join(""); }
  h += `<div class="section-h">سوق ${ERAS[S.era].name}</div>` + rest.map(goodRow).join("");
  return h;
}
function goodRow(g){
  const b = canBuy(g.id);
  const learned = S.known[knowKey(g.id,S.era)];
  return `<button class="good" data-good="${g.id}">
    <div class="ic">${g.icon}</div>
    <div><div class="nm">${g.name}${learned?"":'<span class="tag">جديد</span>'}</div>
      <div class="own">${owned(g.id)?`لديك ${owned(g.id)} · تكلفتك ${Math.round(S.cargo[g.id].cost/owned(g.id))}`:(b?"متوفر":"غير متوفر للشراء")}</div></div>
    <div class="price buy"><small>شراء</small>${b?`<b>${buyPrice(g.id)}</b>`:'<span class="na">—</span>'}</div>
    <div class="price sell"><small>بيع</small><b>${sellPrice(g.id)}</b></div>
  </button>`;
}

function machineView(){
  let h = "";
  if(S.jumpsLeft<=0) h += `<div class="card"><div style="margin-bottom:10px">⌛ نفد وقود الآلة. أي بضاعة متبقية ستُباع بأسعار هذا السوق.</div>
    <button class="btn" data-act="finish">إنهاء الرحلة وحساب الثروة</button></div>`;
  else h += `<div class="section-h">اختر وجهتك (وقود الرحلة ${CFG.fuel} 🪙)</div>`;
  for(const er of ERA_ORDER){
    if(S.jumpsLeft<=0) break;
    if(er===S.era) continue; const E = ERAS[er];
    h += `<div class="card"><button class="dest" data-go="${er}"><div class="ic">${E.icon}</div>
      <div><div class="t">${E.name} — ${E.year}</div><div class="d">${E.desc}</div></div></button></div>`;
  }
  const u = CFG.upgrades[S.upg];
  h += `<div class="section-h">ورشة الآلة</div><div class="card">
    <div style="margin-bottom:10px">📦 سعة المخزن الحالية: <b>${S.cap}</b> وحدة</div>
    ${u?`<button class="btn" data-act="upgrade" ${S.gold<u.cost?"disabled":""}>توسيع المخزن +${u.cap} مقابل ${u.cost} 🪙</button>`
       :`<div class="na">وصلت آلتك إلى أقصى سعة 🎉</div>`}
  </div>
  <div class="card"><div style="font-size:14px;color:var(--muted);margin-bottom:10px">
    ثروتك التقديرية: <b style="color:var(--gold)">${S.gold+cargoValue()}</b> 🪙 (ذهب + بضاعة بأسعار هذا السوق)</div>
    <button class="btn ghost" data-act="restart">بدء رحلة جديدة من الصفر</button></div>`;
  return h;
}

function bookView(){
  const k = knownCount();
  let h = `<div class="card"><b>📖 دفتر المعرفة</b>
    <div style="font-size:13px;color:var(--muted)">افتح أي سلعة في أي عصر لتكتشف قصتها. اكتشفت ${k} من ${TOTAL_FACTS}.</div>
    <div class="progress"><div style="width:${k/TOTAL_FACTS*100}%"></div></div>
    <div style="font-size:13px">🧠 أسئلة صحيحة: ${S.quizOk} من ${S.quizAll}</div></div>`;
  for(const g of GOODS){
    h += `<div class="section-h">${g.icon} ${g.name}</div>`;
    for(const er of ERA_ORDER){
      const ok = S.known[knowKey(g.id,er)];
      h += `<div class="fact ${ok?"":"locked"}"><div class="h">${ERAS[er].icon} ${ERAS[er].name}${ok?` · السعر الأساسي ${g.e[er].p}`:""}</div>
        ${ok?esc(g.e[er].f):"🔒 سافر إلى هذا العصر وافتح السلعة لاكتشاف المعلومة"}</div>`;
    }
  }
  return h;
}

/* --- نافذة التداول --- */
let tradeQty = 1, tradeSide = "buy";
function openTrade(gid){
  learn(gid,S.era);
  tradeSide = canBuy(gid) && (owned(gid)===0) ? "buy" : (owned(gid)>0 ? "sell" : "buy");
  tradeQty = 1;
  sheet = ()=>drawTrade(gid);
  render();
}
function drawTrade(gid){
  const g = G[gid], info = g.e[S.era];
  const b = canBuy(gid), own = owned(gid);
  const lim = tradeSide==="buy" ? maxBuy(gid) : own;
  tradeQty = Math.max(lim?1:0, Math.min(tradeQty, lim));
  const total = tradeQty ? quote(gid, tradeQty, tradeSide) : 0;
  let profitTxt = "";
  if(tradeSide==="sell" && own){ const avg = S.cargo[gid].cost/own; const p = Math.round(total-avg*tradeQty);
    profitTxt = `<span style="color:${p>=0?"var(--good)":"var(--bad)"}">${p>=0?"ربح":"خسارة"} ${Math.abs(p)}</span>`; }
  const div = document.createElement("div");
  div.className = "overlay"; div.id = "ov";
  div.innerHTML = `<div class="sheet">
    <h2>${g.icon} ${g.name}</h2>
    <div class="sub">${ERAS[S.era].name} · شراء ${b?buyPrice(gid):"—"} · بيع ${sellPrice(gid)} · لديك ${own}</div>
    <div class="history"><b>📜 من التاريخ:</b> ${esc(info.f)}</div>
    <div class="row">
      <button class="btn ${tradeSide==="buy"?"":"ghost"}" data-side="buy" ${b?"":"disabled"}>شراء</button>
      <button class="btn ${tradeSide==="sell"?"":"ghost"}" data-side="sell" ${own?"":"disabled"}>بيع</button>
    </div>
    ${lim===0?`<div class="na" style="text-align:center;margin:16px 0">${tradeSide==="buy"?(b?(cargoUsed()>=S.cap?"المخزن ممتلئ":"الذهب غير كافٍ"):"هذه السلعة غير متوفرة للشراء في هذا العصر — لكن يمكنك بيعها هنا!"):"لا تملك هذه السلعة"}</div>`:`
    <div class="qty">
      <button data-q="-5">«</button><button data-q="-1">−</button>
      <div class="n">${tradeQty}</div>
      <button data-q="1">+</button><button data-q="5">»</button>
      <button class="mx" data-q="max">الكل (${lim})</button>
    </div>
    <div class="summary"><span>${tradeSide==="buy"?"التكلفة":"العائد"}: <b style="color:var(--text)">${total} 🪙</b></span><span>${profitTxt}</span></div>
    <div class="summary"><span>💡 كل وحدة تشتريها ترفع السعر قليلاً، وكل وحدة تبيعها تخفضه (العرض والطلب)</span></div>
    <button class="btn" data-act="confirm">${tradeSide==="buy"?"تأكيد الشراء":"تأكيد البيع"}</button>`}
    <button class="btn ghost" style="margin-top:8px" data-act="close">إغلاق</button>
  </div>`;
  div.addEventListener("click", e=>{
    if(e.target===div){ closeSheet(); return; }
    const t = e.target.closest("button"); if(!t) return;
    if(t.dataset.side){ tradeSide = t.dataset.side; tradeQty = 1; render(); }
    else if(t.dataset.q){ tradeQty = t.dataset.q==="max" ? lim : tradeQty + (+t.dataset.q); render(); }
    else if(t.dataset.act==="confirm"){ doTrade(gid, tradeQty, tradeSide); closeSheet(); }
    else if(t.dataset.act==="close"){ closeSheet(); }
  });
  document.body.appendChild(div);
}
function closeSheet(){ sheet = null; render(); }

/* --- سؤال المعرفة --- */
function openQuiz(){
  const q = QUIZ[Math.floor(Math.random()*QUIZ.length)];
  let answered = -1;
  sheet = ()=>{
    const div = document.createElement("div"); div.className="overlay center"; div.id="ov";
    div.innerHTML = `<div class="sheet">
      <h2>🧠 سؤال من حارس الزمن</h2>
      <div class="sub">أجب إجابة صحيحة لتربح 30 🪙</div>
      <div style="font-weight:700;margin:10px 0 14px">${esc(q.q)}</div>
      ${q.o.map((o,i)=>`<button class="opt ${answered<0?"":i===q.a?"right":i===answered?"wrong":""}" data-i="${i}" ${answered<0?"":"disabled"}>${esc(o)}</button>`).join("")}
      ${answered<0?"":`<button class="btn" data-act="close">متابعة</button>`}
    </div>`;
    div.addEventListener("click", e=>{
      const t = e.target.closest("button"); if(!t) return;
      if(t.dataset.i!==undefined && answered<0){
        answered = +t.dataset.i; S.quizAll++;
        if(answered===q.a){ S.quizOk++; S.gold+=30; toast("إجابة صحيحة! +30 🪙"); } else toast("إجابة خاطئة");
        save(); render();
      } else if(t.dataset.act==="close") closeSheet();
    });
    document.body.appendChild(div);
  };
  render();
}

      <li>وسّع مخزنك في ورشة الآلة، وأجب على أسئلة حارس الزمن لتربح أكثر.</li>
    </ol></div>
    ${has&&!has.over?`<button class="btn" data-act="continue" style="margin-bottom:8px">متابعة الرحلة المحفوظة</button>`:""}
    <button class="btn ${has&&!has.over?"ghost":""}" data-act="new">ابدأ رحلة جديدة</button>
  </div>`;
}
function rank(w){
  if(w>=8000) return ["🏆 أسطورة الزمن","تجارتك ستُدرّس في كتب الاقتصاد عبر كل العصور!"];
  if(w>=3000) return ["🐫 سيد القوافل","تعرف جيداً ما يندر في كل عصر."];
  if(w>=800)  return ["⚖️ تاجر ماهر","بداية قوية! اقرأ دفتر المعرفة لتكتشف فرصاً أكبر."];
  return ["🎒 تاجر مبتدئ","جرّب ملاحظة السلع غير المتوفرة في كل عصر — هي مفتاح الربح."];
}
function endScreen(){
  const w = S.gold, [title,msg] = rank(w);
  return `<div class="splash">
    <div class="logo">⌛</div><h1>انتهت رحلاتك عبر الزمن</h1>
    <div class="card" style="text-align:center">
      <div style="font-size:14px;color:var(--muted)">ثروتك النهائية</div>
      <div style="font-size:40px;font-weight:700;color:var(--gold)">${w} 🪙</div>
      <div style="font-size:20px;font-weight:700;margin-top:6px">${title}</div>
      <p style="margin:6px 0 0">${msg}</p>
    </div>
    <div class="card how">
      <div>📖 معلومات تاريخية اكتشفتها: <b>${knownCount()} / ${TOTAL_FACTS}</b></div>
      <div>🧠 أسئلة صحيحة: <b>${S.quizOk} / ${S.quizAll}</b></div>
      <div>💰 أفضل صفقة: <b>${S.bestTrade} 🪙</b></div>
    </div>
    <button class="btn" data-act="new">العب مرة أخرى</button>
  </div>`;
}

/* --- الأحداث العامة --- */
document.addEventListener("click", e=>{
  if(e.target.closest("#ov")) return;
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; render(); window.scrollTo(0,0); }
  else if(t.dataset.good){ openTrade(t.dataset.good); }
  else if(t.dataset.go){ travel(t.dataset.go); }
  else if(t.dataset.act==="upgrade") buyUpgrade();
  else if(t.dataset.act==="finish") finalSale();
  else if(t.dataset.act==="new"){ clearSave(); newGame(); tab="market"; render(); }
  else if(t.dataset.act==="continue"){ S = load(); render(); }
  else if(t.dataset.act==="restart"){ if(confirm("هل تريد بدء رحلة جديدة؟ سيضيع تقدمك الحالي.")){ clearSave(); S=null; render(); } }
});

// render يعيد بناء النافذة: احذف القديمة أولاً
const _render = render;
render = function(){
  const ov=document.getElementById("ov"); if(ov) ov.remove();
  _render();
  const nv=document.getElementById("ov"); if(ov && nv) nv.classList.add("still"); // بدون حركة عند إعادة الرسم
};

// زر الرجوع في أندرويد
window.onAndroidBack = function(){
  if(sheet){ closeSheet(); return true; }
  if(S && !S.over && tab!=="market"){ tab="market"; render(); return true; }
  return false;
};

render();
</script>
</body>
</html>
