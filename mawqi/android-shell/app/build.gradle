plugins { id 'com.android.application' }

android {
    namespace 'com.metallines.mawqi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.metallines.mawqi'
        minSdk 24
        targetSdk 34
        // Above the old Expo builds (≤9) so it installs over them.
        versionCode 20
        versionName '2.0'
        buildConfigField 'String', 'APP_URL', '"https://app.metal-lines.com/m/"'
    }
    buildFeatures { buildConfig true }
    // Same key as the earlier builds, so the phone updates in place without uninstalling.
    signingConfigs {
        release { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
