plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baqala.invoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.baqala.invoice'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('baqala-release.jks')
            storePassword 'baqala123'
            keyAlias 'baqala'
            keyPassword 'baqala123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
