<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f06292">
  <meta name="description" content="رحلتي — تطبيق شامل لمتابعة الحمل أسبوعاً بأسبوع">
  <title>رحلتي — متابعة الحمل</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="رجوع" hidden>→</button>
    <h1 id="title">رحلتي 🤰</h1>
    <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي">🌙</button>
  </header>

  <main id="app"></main>

  <nav class="tabbar" id="tabbar">
    <button data-view="home" class="active"><span>🏠</span>الرئيسية</button>
    <button data-view="weeks"><span>📅</span>الأسابيع</button>
    <button data-view="roadmap"><span>🗺️</span>خارطة الطريق</button>
    <button data-view="tools"><span>🧰</span>الأدوات</button>
    <button data-view="more"><span>☰</span>المزيد</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
