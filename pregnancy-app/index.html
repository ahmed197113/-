<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1428">
  <meta name="description" content="نبضٌ صغير — تطبيق شامل لمتابعة الحمل أسبوعاً بأسبوع">
  <title>نبضٌ صغير</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="رجوع" hidden>→</button>
    <h1 id="title">نبضٌ صغير 💗</h1>
    <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي">🌙</button>
  </header>

  <main id="app"></main>

  <nav class="tabbar" id="tabbar">
    <button data-view="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">الرئيسية</span></button>
    <button data-view="weeks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg><span class="lbl">رحلتي</span></button>
    <button data-view="assist" class="mid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M6.5 11.5h3l1.2-2 1.6 4 1.2-2h3.8" stroke-width="1.6"/></svg><span class="lbl">اسألي</span></button>
    <button data-view="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg><span class="lbl">صحتي</span></button>
    <button data-view="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="lbl">المزيد</span></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="data_more.js"></script>
  <script src="qa.js"></script>
  <script src="qa_more.js"></script>
  <script src="daily.js"></script>
  <script src="config.js"></script>
  <script src="photos.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="account.js"></script>
  <script src="community.js"></script>
  <script src="notify.js"></script>

</html>
