<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة العهد</title>
<style>
  :root { --p: #1e1757; --c: #c0743f; --muted: #5d6b66; --border: #dfe5e2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 22px 16px; font-family: system-ui, sans-serif; background: radial-gradient(circle at 15% 0%, #3a2f8f, transparent 55%), radial-gradient(circle at 100% 100%, rgba(192,116,63,.35), transparent 50%), linear-gradient(160deg, var(--p), #0c0828); color: #15201c; display: flex; flex-direction: column; justify-content: center; }
  .head { text-align: center; color: #fff; margin-bottom: 18px; }
  .logo { display: inline-block; background: #fff; border-radius: 20px; padding: 8px 12px; } .logo img { width: 64px; display: block; }
  .head h1 { font-size: 18px; margin: 10px 0 4px; } .head p { margin: 0; opacity: .85; font-size: 14px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; width: 100%; border: 0; text-align: start; font: inherit; color: inherit; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .opt .ic { width: 46px; height: 46px; border-radius: 14px; background: #ebe9f6; display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
  .opt b { display: block; font-size: 15px; margin-bottom: 3px; }
  .opt span { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .opt.main { outline: 3px solid var(--c); }
  .opt .badge { display: inline-block; background: var(--c); color: #fff; border-radius: 99px; padding: 0 8px; font-size: 11px; font-weight: 800; margin-inline-start: 6px; vertical-align: middle; }
  .server { display: none; margin-top: 12px; }
  .server.show { display: block; }
  input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 11px; font-size: 16px; direction: ltr; text-align: left; }
  .go { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 11px; background: var(--p); color: #fff; font-size: 16px; font-weight: 700; }
  .err { color: #c0392b; font-size: 13px; min-height: 16px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo"><img src="logo.png" alt="الخطوط المعدنية"></div>
    <h1>شركة الخطوط المعدنية للمقاولات العامة</h1>
    <p>نظام إدارة العهد — اختر طريقة التشغيل</p>
  </div>

  <button class="opt main" id="local">
    <div class="ic">📱</div>
    <div><b>استخدام على هذا الجوال <span class="badge">موصى به للبدء</span></b><span>النظام كاملاً على جوالك بدون خادم ولا إنترنت. تسجل عهد الموظفين ومصروفاتهم بنفسك، مع نسخ احتياطي.</span></div>
  </button>

  <div class="opt" id="srv">
    <div class="ic">🌐</div>
    <div style="flex:1"><b>الربط بخادم الشركة</b><span>ليدخل كل موظف من جواله ويسجل مصروفاته، وترى أنت كل شيء لحظياً.</span>
      <div class="server" id="box">
        <input id="url" placeholder="https://custody.example.com" inputmode="url" autocomplete="url">
        <div class="err" id="err"></div>
        <button class="go" id="go">اتصال</button>
      </div>
    </div>
  </div>

  <button class="opt" id="demo">
    <div class="ic">🧪</div>
    <div><b>تجربة ببيانات تجريبية</b><span>شركة وهمية فيها موظفون ومشاريع وعهد ومصروفات لتتعرف على كل الشاشات (مدير، محاسب، موظف).</span></div>
  </button>

<script>
  const $ = id => document.getElementById(id);
  $('local').onclick = () => AndroidBridge.startLocal();
  $('demo').onclick = () => AndroidBridge.startDemo();
  $('srv').onclick = e => { if (e.target.closest('#box')) return; $('box').classList.add('show'); $('url').focus(); };
  $('go').onclick = () => {
    let url = $('url').value.trim().replace(/\/+$/, '');
    if (!url) return ($('err').textContent = 'أدخل عنوان الخادم');
    if (!/^https?:\/\//.test(url)) url = 'http://' + url;
    AndroidBridge.setServer(url);
  };
</script>
</body>
</html>
