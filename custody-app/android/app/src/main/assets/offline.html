<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font-family: system-ui, sans-serif; background: #f4f6f5; color: #17201d; text-align: center; }
  .ico { font-size: 56px; } h1 { font-size: 20px; } p { color: #5f6b67; }
  button { display: block; width: 260px; margin: 10px auto 0; padding: 13px; border-radius: 10px; font-size: 16px; font-weight: 700; border: 1px solid #1e1757; background: #1e1757; color: #fff; }
  button.alt { background: #fff; color: #1e1757; }
</style>
</head>
<body>
  <div>
    <div class="ico">📡</div>
    <h1>تعذر الاتصال بالخادم</h1>
    <p>تأكد من اتصال الإنترنت ثم أعد المحاولة</p>
    <button onclick="AndroidBridge.reload()">إعادة المحاولة</button>
    <button class="alt" onclick="AndroidBridge.changeServer()">تغيير طريقة التشغيل</button>
  </div>
</body>
</html>
